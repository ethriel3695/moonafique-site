name: Grimmunity
on:
  pull_request:
  push:
    branches: [main, add-storybook, codex/site-checkpoint-2026-10-26]
jobs:
  billing-and-fulfillment:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grim_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      GRIM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/grim_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter moonafique-site test:grim
      - run: pnpm --filter moonafique-site exec tsc --noEmit
      - run: pnpm --filter moonafique-site exec eslint lib/grimmunity lib/customs lib/catalog-policy.ts components/grimmunity components/customs emails/grimmunity-interest-email.tsx emails/custom-request-email.tsx app/grimmunity app/customs app/account/grimmunity app/admin/grimmunity app/admin/customs app/api/grimmunity app/api/custom-requests app/api/checkout app/api/stripe-webhook lib/products.ts scripts/grimmunity tests/grimmunity vitest.grim.config.mts
